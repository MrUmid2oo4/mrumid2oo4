name: GitHub Snake & Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  # ── Generate the contribution snake animation ────────────────────────────
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: MrUmid2oo4
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#00F2FE&color_dots=#0d1117,#1a1a2e,#16213e,#0f3460,#4facfe,#00f2fe

      - name: Push Snake to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Generate lowlighter/metrics infographic card ─────────────────────────
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics Infographic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: MrUmid2oo4
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tashkent
          config_theme: tokyonight
          config_order: base.header, isocalendar, languages, habits, achievements

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_lines: yes
          plugin_lines_history_limit: 2
          plugin_lines_repositories_limit: 4

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          filename: github-metrics.svg
